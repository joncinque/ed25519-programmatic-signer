[package]
name = "spl-ed25519-signer-client"
version = "1.0.0"
description = "Off-chain client helpers for the SPL Ed25519 Signer program"
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

[dependencies]
solana-address = { workspace = true }
solana-hash = { workspace = true }
solana-instruction = { workspace = true, features = ["wincode"] }
solana-message = { workspace = true, features = ["wincode"] }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
solana-transaction = { workspace = true, features = ["wincode"] }
spl-ed25519-signer-interface = { workspace = true }

[dev-dependencies]
solana-address = { workspace = true, features = ["atomic"] }
test-case = { workspace = true }
