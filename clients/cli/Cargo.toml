[package]
name = "spl-programmatic-signer-cli"
version = "0.1.0"
description = "Command-line setup client for SPL programmatic signers"
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[[bin]]
name = "spl-programmatic-signer"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true, features = ["derive"] }
indoc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
solana-account = { workspace = true }
solana-account-decoder-client-types = { workspace = true }
solana-address = { workspace = true }
solana-clap-v3-utils = { workspace = true, features = ["agave-unstable-api"] }
solana-cli-config = { workspace = true, features = ["agave-unstable-api"] }
solana-cli-output = { workspace = true, features = ["agave-unstable-api"] }
solana-commitment-config = { workspace = true }
solana-hash = { workspace = true }
solana-keypair = { workspace = true }
solana-message = { workspace = true, features = ["blake3", "wincode"] }
solana-native-token = { workspace = true }
solana-remote-wallet = { workspace = true, features = ["agave-unstable-api"] }
solana-rpc-client = { workspace = true, features = ["agave-unstable-api"] }
solana-rpc-client-types = { workspace = true, features = ["agave-unstable-api"] }
solana-signature = { workspace = true, features = ["verify"] }
solana-signer = { workspace = true }
solana-transaction = { workspace = true, features = ["wincode"] }
solana-transaction-status = { workspace = true, features = ["agave-unstable-api"] }
spl-ed25519-signer-client = { workspace = true }
spl-legacy-message-executor-client = { workspace = true }
spl-legacy-message-executor-interface = { workspace = true }
spl-nonce-client = { workspace = true }
spl-nonce-interface = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wincode = { workspace = true }

[dev-dependencies]
libtest-mimic = { workspace = true }
solana-instruction = { workspace = true }
solana-program-pack = { workspace = true }
solana-system-interface = { workspace = true, features = ["wincode"] }
solana-test-validator = { workspace = true, features = ["dev-context-only-utils"] }
spl-token-interface = { workspace = true }
test-case = { workspace = true }
tempfile = { workspace = true }

[[test]]
name = "validator"
harness = false
