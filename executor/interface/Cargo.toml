[package]
name = "spl-message-executor-interface"
version = "0.1.0"
description = "Interface for the SPL Message Executor program"
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[lib]
crate-type = ["rlib"]

[features]
codama = ["dep:codama-macros"]

[package.metadata.solana]
program-id = "ExecxgyHYsAXB4c5dZodV1zJZ9hqfsDCYkRDRATrpkFR"

[lints]
workspace = true

[dependencies]
codama-macros = { workspace = true, optional = true }
solana-address = { workspace = true, features = ["decode"] }
solana-hash = { workspace = true }
solana-message = { workspace = true, features = ["wincode"] }
solana-program-error = { workspace = true }
solana-sha256-hasher = { workspace = true, features = ["sha2"] }
wincode = { workspace = true, features = ["derive"] }

[dev-dependencies]
solana-hash = { workspace = true, features = ["decode"] }
